<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>なべHub 難読化・解読ツール v5.2</title>
    <style>
        :root {
            --bg: #1a1a2e; --bg2: #16213e; --panel: #1e1e30; --card: #252540;
            --text: #eee; --sub: #aaa; --accent: #e94560; --accent2: #ff6b81;
            --input-bg: #0d0d1a; --input-text: #0f0; --border: #333;
        }
        .light {
            --bg: #f0f0f5; --bg2: #e0e0ea; --panel: #fff; --card: #f5f5fa;
            --text: #222; --sub: #666; --accent: #c23152; --accent2: #e94560;
            --input-bg: #fafafa; --input-text: #060; --border: #ddd;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: linear-gradient(135deg, var(--bg), var(--bg2)); color: var(--text); min-height: 100vh; padding: 20px; transition: all 0.3s; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { text-align: center; font-size: 28px; margin-bottom: 5px; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .sub { text-align: center; color: var(--sub); font-size: 13px; margin-bottom: 10px; }
        .tab-bar { display: flex; gap: 5px; margin-bottom: 15px; flex-wrap: wrap; }
        .tab-bar button { flex: 1; min-width: 60px; padding: 10px 8px; border: none; background: var(--card); color: var(--sub); cursor: pointer; font-size: 13px; font-weight: bold; border-radius: 8px 8px 0 0; transition: all 0.2s; }
        .tab-bar button.active { background: var(--panel); color: var(--accent); border: 1px solid var(--accent); border-bottom: none; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .panel { background: var(--panel); border-radius: 0 0 12px 12px; padding: 15px 20px; margin-bottom: 15px; border: 1px solid var(--border); }
        .panel h3 { font-size: 14px; color: var(--accent2); margin-bottom: 10px; }
        .row { display: flex; gap: 15px; flex-wrap: wrap; }
        .col { flex: 1; min-width: 280px; }
        textarea { width: 100%; height: 280px; background: var(--input-bg); color: var(--input-text); border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-family: 'Consolas', 'Monaco', monospace; font-size: var(--fs, 13px); resize: vertical; }
        button { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; transition: all 0.2s; color: #fff; }
        button:hover { transform: translateY(-1px); opacity: 0.9; }
        .btn-main { background: linear-gradient(135deg, var(--accent), #c23152); width: 100%; padding: 14px; font-size: 16px; margin-top: 10px; }
        .btn-sub { background: #0f3460; width: 100%; margin-top: 5px; }
        .btn-clear { background: #555; color: #f55; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn-preset { background: var(--card); color: var(--accent2); font-size: 12px; padding: 6px 12px; margin: 2px; border: 1px solid var(--border); }
        .btn-preset:hover { border-color: var(--accent); }
        .toggle-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
        .toggle-card { background: var(--card); border-radius: 8px; padding: 12px; border: 1px solid var(--border); transition: all 0.2s; }
        .toggle-card.active { border-color: var(--accent); background: #2a1a2a; }
        .light .toggle-card.active { background: #fff0f0; }
        .toggle-card .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .toggle-card .name { font-weight: bold; font-size: 13px; }
        .toggle-card .desc { font-size: 11px; color: var(--sub); margin-bottom: 8px; }
        .toggle-card .settings { display: none; margin-top: 8px; }
        .toggle-card.active .settings { display: block; }
        .toggle-card input[type="range"] { width: 100%; margin: 4px 0; }
        .toggle-card .val { font-size: 11px; color: var(--accent2); text-align: right; }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #555; border-radius: 24px; transition: .3s; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: .3s; }
        input:checked + .slider { background: var(--accent); }
        input:checked + .slider:before { transform: translateX(20px); }
        .detect-result { background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-top: 10px; font-size: 12px; color: var(--accent2); white-space: pre-wrap; }
        .stats { display: flex; gap: 15px; margin: 10px 0; font-size: 12px; color: var(--sub); flex-wrap: wrap; }
        .history-item { background: var(--card); border-radius: 6px; padding: 8px 12px; margin: 4px 0; font-size: 11px; cursor: pointer; border: 1px solid var(--border); }
        .history-item:hover { border-color: var(--accent); }
        input[type="text"], input[type="number"] { padding: 8px 12px; background: var(--input-bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; font-size: 13px; width: 100%; }
        .footer { text-align: center; color: #555; font-size: 12px; margin-top: 20px; }
        @media (max-width: 600px) { .toggle-grid { grid-template-columns: 1fr; } .tab-bar button { font-size: 11px; padding: 8px 4px; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>なべHub 難読化・解読ツール v5.2</h1>
        <p class="sub">解読強化版 - テーブルシャッフル対応・無制限多段階解読・詳細エラー表示</p>

        <div class="tab-bar">
            <button class="active" onclick="switchTab('obfuscate')">難読化</button>
            <button onclick="switchTab('deobfuscate')">解読</button>
            <button onclick="switchTab('settings')">設定</button>
        </div>

        <!-- ===== 難読化タブ ===== -->
        <div id="tab-obfuscate" class="tab-content active">
            <div class="panel"><h3>プリセット</h3>
                <button class="btn-preset" onclick="preset('light')">簡易</button>
                <button class="btn-preset" onclick="preset('normal')">標準</button>
                <button class="btn-preset" onclick="preset('strong')">強化</button>
                <button class="btn-preset" onclick="preset('max')">最強</button>
            </div>
            <div class="panel"><h3>パターン（13種）</h3><div class="toggle-grid" id="patternGrid"></div></div>
            <button class="btn-main" onclick="obfuscate()">難読化実行</button>
            <div class="stats" id="obfStats"></div>
            <div class="row" style="margin-top:10px;">
                <div class="col"><p style="color:var(--sub);">入力</p><textarea id="obfInput" placeholder="Luaコード..."></textarea><button class="btn-clear btn-sm" onclick="clearObfuscate()">クリア</button></div>
                <div class="col"><p style="color:var(--sub);">結果</p><textarea id="obfOutput" readonly></textarea><button class="btn-sub btn-sm" onclick="copyResult('obfOutput')">コピー</button></div>
            </div>
            <div class="panel" style="margin-top:10px;"><h3>履歴</h3><div id="historyList"><span style="color:var(--sub);">なし</span></div><button class="btn-clear btn-sm" onclick="clearHistory()">履歴クリア</button></div>
        </div>

        <!-- ===== 解読タブ ===== -->
        <div id="tab-deobfuscate" class="tab-content">
            <div class="row">
                <div class="col"><p style="color:var(--sub);">難読化コード</p><textarea id="deobfInput" placeholder="難読化コードを貼り付け..."></textarea></div>
                <div class="col"><p style="color:var(--sub);">解読結果</p><textarea id="deobfOutput" readonly></textarea><button class="btn-sub btn-sm" onclick="copyResult('deobfOutput')">コピー</button></div>
            </div>
            <div class="panel" style="margin-top:10px;"><h3>解読オプション</h3>
                <div class="row">
                    <div class="col"><button class="btn-main" onclick="deepDecode()" style="margin-top:0;">詳細解読（無制限多段階）</button></div>
                    <div class="col"><p style="font-size:12px;color:var(--sub);">手動キー</p><input type="number" id="manualKey" placeholder="XORキー(1-255)" min="1" max="255"><button class="btn-sub btn-sm" onclick="decodeWithManualKey()">手動キーで解読</button></div>
                    <div class="col"><p style="font-size:12px;color:var(--sub);">総当たり</p><button class="btn-sub btn-sm" onclick="bruteForceXOR()">総当たり(1-255)</button></div>
                </div>
            </div>
            <div class="detect-result" id="detectInfo">解読結果の詳細がここに表示されます</div>
        </div>

        <!-- ===== 設定タブ ===== -->
        <div id="tab-settings" class="tab-content">
            <div class="panel"><h3>テーマ</h3><button class="btn-preset" onclick="setTheme('dark')">ダーク</button><button class="btn-preset" onclick="setTheme('light')">ライト</button></div>
            <div class="panel"><h3>フォント</h3><input type="range" id="fontSize" min="10" max="20" value="13" oninput="updateFontSize(this.value)"><span id="fontSizeVal" style="color:var(--accent2);">13px</span></div>
        </div>
        <p class="footer">なべHub 難読化・解読ツール v5.2 | Powered by GitHub Pages</p>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-bar button').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            event.target.classList.add('active');
        }
        function setTheme(t) { document.body.className = t === 'light' ? 'light' : ''; localStorage.setItem('nabehub-theme', t); }
        document.addEventListener('DOMContentLoaded', () => { setTheme(localStorage.getItem('nabehub-theme') || 'dark'); });
        function updateFontSize(v) { document.documentElement.style.setProperty('--fs', v + 'px'); document.getElementById('fontSizeVal').textContent = v + 'px'; localStorage.setItem('nabehub-fs', v); }
        document.addEventListener('DOMContentLoaded', () => { const fs = localStorage.getItem('nabehub-fs') || '13'; document.getElementById('fontSize').value = fs; updateFontSize(fs); });

        // ===== パターン =====
        const patterns = [
            { id: 'removeComments', name: 'コメント削除', setting: null, def: true, light: true, normal: true, strong: true, max: true },
            { id: 'minify', name: '圧縮', setting: null, def: true, light: true, normal: true, strong: true, max: true },
            { id: 'removeLines', name: '改行のみ削除', setting: null, def: false },
            { id: 'removeSpaces', name: '空白のみ削除', setting: null, def: false },
            { id: 'shuffleVars', name: '変数名短縮', setting: { type: 'range', label: '短さ', min: 1, max: 10, def: 3 }, def: false, strong: true, max: true },
            { id: 'asciiEncode', name: 'ASCIIコード化', setting: null, def: true, light: true, normal: true },
            { id: 'xorEncrypt', name: 'XOR暗号化', setting: { type: 'range', label: 'キー', min: 1, max: 255, def: 128 }, def: false, strong: true, max: true },
            { id: 'splitStrings', name: '文字列分割', setting: { type: 'range', label: '分割', min: 1, max: 50, def: 5 }, def: false, strong: true },
            { id: 'numberObf', name: '数値難読化', setting: null, def: false, max: true },
            { id: 'base64Encode', name: 'Base64化', setting: null, def: false, max: true },
            { id: 'wrapLoadstring', name: 'loadstringラップ', setting: null, def: true, light: true, normal: true, strong: true, max: true },
            { id: 'deadCode', name: 'デッドコード', setting: { type: 'range', label: '行数', min: 1, max: 10, def: 3 }, def: false },
            { id: 'ctrlFlow', name: '制御フロー偽装', setting: null, def: false },
        ];
        const grid = document.getElementById('patternGrid');
        patterns.forEach(p => {
            const card = document.createElement('div'); card.className = 'toggle-card' + (p.def ? ' active' : ''); card.id = 'card-' + p.id;
            let sHTML = '';
            if (p.setting) { const s = p.setting; sHTML = `<div class="settings"><span style="font-size:11px;color:var(--sub);">${s.label}: <span class="val" id="val-${p.id}">${s.def}</span></span><input type="range" min="${s.min}" max="${s.max}" value="${s.def}" oninput="updateVal('${p.id}', this.value)"></div>`; }
            card.innerHTML = `<div class="header"><span class="name">${p.name}</span><label class="switch"><input type="checkbox" id="${p.id}" ${p.def ? 'checked' : ''} onchange="toggleCard('${p.id}', this.checked)"><span class="slider"></span></label></div><div class="desc">${p.desc||''}</div>${sHTML}`;
            grid.appendChild(card);
        });
        function toggleCard(id, on) { document.getElementById('card-' + id).classList.toggle('active', on); }
        function updateVal(id, val) { document.getElementById('val-' + id).textContent = val; }
        function preset(lv) { patterns.forEach(p => { const cb = document.getElementById(p.id); cb.checked = p[lv] || false; document.getElementById('card-' + p.id).classList.toggle('active', cb.checked); }); }

        function hiddenKey(key) {
            const m = [
                () => '(' + (key + Math.floor(Math.random() * 50 + 30)) + '-' + Math.floor(Math.random() * 50 + 30) + ')',
                () => '(#' + '"' + 'x'.repeat(Math.min(key % 20 + 1, 15)) + '"' + '+' + (key - Math.min(key % 20 + 1, 15)) + ')',
                () => { const a = Math.floor(key / 2); const b = Math.ceil(key / 2); return '(' + a + '+' + a + '+' + (b - a) + ')'; },
            ]; return m[Math.floor(Math.random() * m.length)]();
        }

        function getHistory() { try { return JSON.parse(localStorage.getItem('nabehub-history') || '[]'); } catch(e) { return []; } }
        function addHistory(input, output) { let h = getHistory(); h.unshift({ input: input.slice(0, 200), output: output.slice(0, 200), time: new Date().toLocaleTimeString() }); if (h.length > 5) h = h.slice(0, 5); localStorage.setItem('nabehub-history', JSON.stringify(h)); renderHistory(); }
        function renderHistory() { const el = document.getElementById('historyList'); const h = getHistory(); if (h.length === 0) { el.innerHTML = '<span style="color:var(--sub);">なし</span>'; return; } el.innerHTML = h.map((e, i) => `<div class="history-item" onclick="loadHistory(${i})">[${e.time}] ${e.input.slice(0, 50)}...</div>`).join(''); }
        function loadHistory(i) { const h = getHistory(); if (h[i]) { document.getElementById('obfInput').value = h[i].input; document.getElementById('obfOutput').value = h[i].output; } }
        function clearHistory() { localStorage.removeItem('nabehub-history'); renderHistory(); }
        document.addEventListener('DOMContentLoaded', renderHistory);

        function obfuscate() {
            let code = document.getElementById('obfInput').value; const origLen = code.length;
            if (!code.trim()) { alert('コードを入力'); return; }
            const get = (id) => document.getElementById(id).checked;
            const getVal = (id) => parseInt(document.getElementById('val-' + id)?.textContent || '0');
            if (get('removeComments')) code = code.replace(/--[^\n]*/g, '').replace(/\n\s*\n/g, '\n');
            if (get('shuffleVars')) { const len = getVal('shuffleVars'); let c = 0; code = code.replace(/\blocal\s+([a-zA-Z_]\w*)/g, (m, n) => { if (['and','break','do','else','elseif','end','false','for','function','goto','if','in','local','nil','not','or','repeat','return','then','true','until','while'].includes(n)) return m; return 'local v' + (c++).toString(36).slice(0, len); }); }
            if (get('splitStrings') && !get('xorEncrypt')) { const sz = getVal('splitStrings'); code = code.replace(/"([^"]{2,})"/g, (m, s) => { if (s.length <= sz) return m; const p = []; for (let i = 0; i < s.length; i += sz) p.push('"' + s.slice(i, i + sz) + '"'); return p.join('..'); }); }
            if (get('numberObf') && !get('xorEncrypt')) code = code.replace(/\b(\d+)\b/g, (m, n) => { const x = parseInt(n); if (x < 2 || x > 9999) return m; const a = Math.floor(Math.random() * 100) + 100; return '(' + (a + x) + '-' + a + ')'; });
            if (get('ctrlFlow')) code = code.replace(/\bif\b/g, 'while true do if');
            if (get('deadCode')) { const lines = getVal('deadCode'); for (let i = 0; i < lines; i++) code += '\nlocal _' + Math.random().toString(36).slice(2, 6) + ' = ' + Math.floor(Math.random() * 1000); }
            if (get('removeLines')) code = code.replace(/\n/g, ' ');
            if (get('removeSpaces')) code = code.replace(/[ \t]+/g, ' ');
            if (get('minify')) code = code.replace(/\s+/g, ' ').trim();
            if (get('xorEncrypt')) { const key = getVal('xorEncrypt') || Math.floor(Math.random() * 200) + 30; const enc = []; for (let i = 0; i < code.length; i++) enc.push('\\' + (code.charCodeAt(i) ^ key)); code = 'local k=' + hiddenKey(key) + ' local c={' + enc.join(',') + '} local r="" for i=1,#c do r=r..string.char(bit32.bxor(tonumber(c[i]),k)) end loadstring(r)()'; }
            if (get('asciiEncode') && !get('xorEncrypt')) { const ch = []; for (let i = 0; i < code.length; i++) ch.push('\\' + code.charCodeAt(i)); code = 'local c={' + ch.join(',') + '} local r="" for i=1,#c do r=r..string.char(tonumber(c[i])) end loadstring(r)()'; }
            if (get('base64Encode')) code = 'loadstring(game:HttpGet("data:text/plain;base64,' + btoa(unescape(encodeURIComponent(code))) + '"))()';
            if (get('wrapLoadstring') && !get('xorEncrypt') && !get('base64Encode')) code = 'loadstring(function() ' + code.replace(/\n/g, ' ') + ' end)()';
            document.getElementById('obfOutput').value = code;
            document.getElementById('obfStats').innerHTML = `元: ${origLen}字 → 後: ${code.length}字 (${Math.round(code.length/origLen*100)}%)`;
            addHistory(document.getElementById('obfInput').value, code);
        }
        function clearObfuscate() { document.getElementById('obfInput').value = ''; document.getElementById('obfOutput').value = ''; document.getElementById('obfStats').innerHTML = ''; }

        // ===== 解読エンジン v5.2 =====
        function extractXORKey(code) {
            let key = null;
            const pats = [/local k=\((\d+)-(\d+)\)/, /local k=\(#"(x*)"\+(\d+)\)/, /local k=\((\d+)\+(\d+)\+(\d+)\)/, /local k=\(string\.byte\("([A-Z])"\)\+(-?\d+)\)/, /local k=(\d+)/];
            for (const p of pats) {
                const m = code.match(p); if (!m) continue;
                if (p.toString().includes('string.byte')) key = (m[1]?.charCodeAt(0) || 65) + parseInt(m[2] || '0');
                else if (m.length === 4 && m[3]) key = parseInt(m[1]) + parseInt(m[2]) + parseInt(m[3]);
                else if (m.length === 3 && m[2] && p.toString().includes('#')) key = (m[1]?.length || 0) + parseInt(m[2]);
                else if (m.length === 3 && m[1] && m[2]) key = parseInt(m[1]) - parseInt(m[2]);
                else if (m[1] && !isNaN(parseInt(m[1]))) key = parseInt(m[1]);
                if (key && !isNaN(key) && key > 0 && key < 256) return key;
            }
            return null;
        }

        function decodeXOR(code) {
            const key = extractXORKey(code); if (!key) return null;
            const cm = code.match(/local c=\{([^}]+)\}/); if (!cm) return null;
            const chars = cm[1].split(',').map(c => parseInt(c.replace(/\\/g, '') || '0'));
            let r = ''; for (const c of chars) { if (!isNaN(c)) r += String.fromCharCode(c ^ key); }
            return r;
        }

        function decodeASCII(code) {
            if (/local c=\{.*\}.*local r="".*string\.char/.test(code) && !/bxor/.test(code)) {
                const cm = code.match(/local c=\{([^}]+)\}/); if (!cm) return null;
                const chars = cm[1].split(',').map(c => parseInt(c.replace(/\\/g, '') || '0'));
                if (chars.some(isNaN)) return null;
                return String.fromCharCode(...chars);
            }
            return null;
        }

        function decodeBase64(code) {
            const m = code.match(/data:text\/plain;base64,([A-Za-z0-9+/=]+)/);
            if (!m) return null;
            try { return decodeURIComponent(escape(atob(m[1]))); } catch(e) { return null; }
        }

        function decodeLoadstringWrap(code) {
            const m = code.match(/loadstring\(function\(\)\s*(.*?)\s*end\)\(\)/);
            return m ? m[1].trim() : null;
        }

        function decodeNumberObf(code) {
            return /\(\d+-\d+\)/.test(code) ? code.replace(/\((\d+)-(\d+)\)/g, (m, a, b) => String(parseInt(a) - parseInt(b))) : code;
        }

        function decodeTableShuffle(code) {
            // WeAreDevs形式のテーブルシャッフルを検出して復元
            const shuffleMatch = code.match(/for\s+\w+,\w+\s+in\s+ipairs\(\{(.+)\}\)\s+do\s+while\s+\w+\[\d+\]\s*<\s*\w+\[\d+\]\s+do\s+(\w+)\[(\w+)\[\d+\]\],\s*\3\[(\w+)\[\d+\]\]/);
            if (!shuffleMatch) return null;

            // スワップテーブルを抽出
            const swapData = shuffleMatch[1];
            const pairs = swapData.match(/\{(-?\d+),(-?\d+)\}/g);
            if (!pairs) return null;

            // ASCIIテーブルを抽出
            const asciiMatch = code.match(/local\s+\w+=\{([^}]+)\}/);
            if (!asciiMatch) return null;

            // ここでテーブルを復元（スワップを逆順に適用）
            let arr = asciiMatch[1].split(',').map(s => s.trim());
            const swaps = pairs.map(p => {
                const m = p.match(/\{(-?\d+),(-?\d+)\}/);
                return [parseInt(m[1]), parseInt(m[2])];
            });

            // 逆順にスワップを適用
            for (let i = swaps.length - 1; i >= 0; i--) {
                const [a, b] = swaps[i];
                if (a >= 0 && a < arr.length && b >= 0 && b < arr.length) {
                    [arr[a], arr[b]] = [arr[b], arr[a]];
                }
            }

            // 復元した配列からASCIIコードをデコード
            const decoded = arr.map(s => {
                const n = parseInt(s.replace(/\\/g, ''));
                return isNaN(n) ? '' : String.fromCharCode(n);
            }).join('');

            return decoded.length > 5 ? decoded : null;
        }

        function deepDecode() {
            let code = document.getElementById('deobfInput').value.trim();
            if (!code) { alert('コードを貼り付けてください'); return; }
            const info = document.getElementById('detectInfo');
            let log = [];
            let maxIter = 50, prev = '', totalLayers = 0;

            while (maxIter-- > 0 && code !== prev) {
                prev = code; totalLayers++;
                let decoded = null, method = '';

                decoded = decodeBase64(code); if (decoded) { method = 'Base64'; code = decoded; }
                if (!decoded) { decoded = decodeXOR(code); if (decoded) { method = 'XOR(キー検出)'; code = decoded; } }
                if (!decoded) { decoded = decodeASCII(code); if (decoded) { method = 'ASCIIコード化'; code = decoded; } }
                if (!decoded) { decoded = decodeLoadstringWrap(code); if (decoded) { method = 'loadstringラップ'; code = decoded; } }
                if (!decoded) { decoded = decodeNumberObf(code); if (decoded !== code) { method = '数値難読化'; code = decoded; } else decoded = null; }
                if (!decoded) { decoded = decodeTableShuffle(code); if (decoded) { method = 'テーブルシャッフル'; code = decoded; } }

                if (method) {
                    log.push(`層${totalLayers}: ${method} → 解読成功 (${code.length}文字)`);
                } else {
                    log.push(`層${totalLayers}: これ以上解読できるパターンがありません`);
                    break;
                }
            }

            document.getElementById('deobfOutput').value = code;
            info.innerHTML = log.join('\n') + '\n\n最終結果: ' + code.length + '文字';
        }

        function decodeWithManualKey() {
            let code = document.getElementById('deobfInput').value.trim();
            const key = parseInt(document.getElementById('manualKey').value);
            if (!key || key < 1 || key > 255) { alert('有効なキー(1-255)を入力'); return; }
            const b64 = decodeBase64(code); if (b64) code = b64;
            const cm = code.match(/local c=\{([^}]+)\}/); if (!cm) { alert('XOR形式のコードが見つかりません'); return; }
            const chars = cm[1].split(',').map(c => parseInt(c.replace(/\\/g, '') || '0'));
            let r = ''; for (const c of chars) { if (!isNaN(c)) r += String.fromCharCode(c ^ key); }
            document.getElementById('deobfOutput').value = r;
            document.getElementById('detectInfo').innerHTML = '手動キー ' + key + ' で復号';
        }

        function bruteForceXOR() {
            let code = document.getElementById('deobfInput').value.trim();
            if (!code) { alert('コードを貼り付けてください'); return; }
            const b64 = decodeBase64(code); if (b64) code = b64;
            const cm = code.match(/local c=\{([^}]+)\}/); if (!cm) { alert('XOR/ASCII形式が見つかりません'); return; }
            const chars = cm[1].split(',').map(c => parseInt(c.replace(/\\/g, '') || '0'));
            const info = document.getElementById('detectInfo'); info.innerHTML = '総当たり中...';
            let found = null;
            function tryKeys(start, end) {
                for (let k = start; k <= end; k++) {
                    if (found !== null) return;
                    let r = ''; let valid = true;
                    for (let i = 0; i < Math.min(chars.length, 30); i++) {
                        const c = chars[i]; if (isNaN(c)) continue;
                        const ch = String.fromCharCode(c ^ k);
                        if (ch < ' ' && ch !== '\n' && ch !== '\t') { valid = false; break; }
                        r += ch;
                    }
                    const kw = ['print','local','loadstring','function','wait','game','workspace','Players','Replicated','if','then','end','for','while','return'];
                    if (valid && kw.some(w => r.includes(w))) {
                        found = k; let full = ''; for (const c of chars) { if (!isNaN(c)) full += String.fromCharCode(c ^ k); }
                        document.getElementById('deobfOutput').value = full;
                        info.innerHTML = '総当たり成功！キー: ' + k;
                        return;
                    }
                }
            }
            [1,64],[65,128],[129,192],[193,255].forEach(([s, e], i) => setTimeout(() => { if (found === null) tryKeys(s, e); if (i === 3 && found === null) info.innerHTML = '総当たり失敗'; }, i * 20));
        }

        function copyResult(id) { const o = document.getElementById(id); o.select(); document.execCommand('copy'); alert('コピーしました！'); }
    </script>
